# Source: dog-k8s-collector/templates/agent.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dog-k8s-collector-agent
  labels:
    app.kubernetes.io/name: dog-k8s-collector
    app.kubernetes.io/instance: dog-k8s-collector
    app.kubernetes.io/version: "0.160.0"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: agent
  namespace: dog-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dog-k8s-collector-agent
      app.kubernetes.io/instance: dog-k8s-collector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dog-k8s-collector-agent
        app.kubernetes.io/instance: dog-k8s-collector
        app.kubernetes.io/component: agent
      annotations: {}
    spec:
      serviceAccountName: dog-k8s-collector-agent
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: "otel/opentelemetry-collector-k8s:0.160.0"
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          # root: /var/log/pods files are root:0640; journald needs DAC_READ_SEARCH + SYS_PTRACE
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: K8S_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: K8S_NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: K8S_POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: GOMEMLIMIT
              valueFrom: {resourceFieldRef: {resource: limits.memory}}
          ports:
            - {name: health-check, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          livenessProbe:
            httpGet: {path: /, port: health-check}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: health-check}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            - {name: hostfs, mountPath: /hostfs, readOnly: true, mountPropagation: HostToContainer}
            - {name: file-storage, mountPath: /var/lib/otelcol}
            - {name: zoneinfo, mountPath: /usr/share/zoneinfo, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: dog-k8s-collector-agent-config
        - name: varlogpods
          hostPath: {path: /var/log/pods, type: Directory}
        - name: hostfs
          hostPath: {path: /}
        - name: file-storage
          hostPath: {path: /var/lib/otelcol, type: DirectoryOrCreate}
        - name: zoneinfo
          hostPath: {path: /usr/share/zoneinfo, type: Directory} # Pending with a clear event on nodes without tzdata, instead of a crashloop
