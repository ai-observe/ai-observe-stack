# dog-k8s-collector without Helm: agent (DaemonSet) + cluster collector (Deployment).
# Generated from helm-charts/dog-k8s-collector 0.1.0 by examples/dog-k8s-collector/kubectl/render.sh
# with values.yaml; namespace: dog-stack. Regenerate instead of editing.
#
#   kubectl create namespace dog-stack   # if needed; PodSecurity "restricted" namespaces need the privileged label
#   kubectl apply -n dog-stack -f collectors.yaml
#
# Before applying, check in the ConfigMaps below:
#   exporters.otlp_grpc.endpoint   -> your gateway (gateway.endpoint in values)
#   processors.resource            -> k8s.cluster.name (clusterName in values)
---
# Source: dog-k8s-collector/templates/agent.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dog-k8s-collector-agent
  labels:
    app.kubernetes.io/name: dog-k8s-collector
    app.kubernetes.io/instance: dog-k8s-collector
    app.kubernetes.io/version: "0.160.0"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: agent
  namespace: dog-stack
---
# Source: dog-k8s-collector/templates/cluster.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dog-k8s-collector-cluster
  labels:
    app.kubernetes.io/name: dog-k8s-collector
    app.kubernetes.io/instance: dog-k8s-collector
    app.kubernetes.io/version: "0.160.0"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: cluster
  namespace: dog-stack
---
# Source: dog-k8s-collector/templates/configmap-agent.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dog-k8s-collector-agent-config
  labels:
    app.kubernetes.io/name: dog-k8s-collector
    app.kubernetes.io/instance: dog-k8s-collector
    app.kubernetes.io/version: "0.160.0"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: agent
  namespace: dog-stack
data:
  config.yaml: |
    # OpenTelemetry agent (DaemonSet) - generated by the dog-k8s-collector chart
    receivers:
      file_log:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/dog-stack_dog-k8s-collector-agent-*/*/*.log
          - /var/log/pods/dog-stack_dog-k8s-collector-cluster-*/*/*.log
        start_at: end
        poll_interval: 200ms
        max_log_size: 1MiB
        include_file_path: true
        include_file_name: false
        file_cache_advise: true
        skip_unmodified_files: true
        storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0
        operators:
          # ---- 1. CRI / docker envelope, partial-line join, pod identity from the path ----
          - type: container
            id: container
          # ---- rule: json-autodetect (json) ----
          - type: add
            id: rule-json-autodetect
            if: "body matches \"^\\\\s*\\\\{\" and attributes[\"dog.log.rule\"] == nil"
            field: attributes["dog.log.rule"]
            value: "json-autodetect"
          - type: json_parser
            id: parse-json-autodetect
            if: "attributes[\"dog.log.rule\"] == \"json-autodetect\""
            on_error: send_quiet
            parse_to: attributes
          - type: severity_parser
            id: severity-json-autodetect-level
            if: "attributes[\"dog.log.rule\"] == \"json-autodetect\" and attributes[\"level\"] != nil"
            on_error: send_quiet
            parse_from: attributes["level"]
            overwrite_text: true
            mapping:
              # pino / bunyan numeric levels on top of the built-in names
              trace: ["10"]
              debug: ["20"]
              info: ["30"]
              warn: ["40"]
              error: ["50"]
              fatal: ["60"]
          - type: severity_parser
            id: severity-json-autodetect-severity
            if: "attributes[\"dog.log.rule\"] == \"json-autodetect\" and attributes[\"severity\"] != nil"
            on_error: send_quiet
            parse_from: attributes["severity"]
            overwrite_text: true
            mapping:
              # pino / bunyan numeric levels on top of the built-in names
              trace: ["10"]
              debug: ["20"]
              info: ["30"]
              warn: ["40"]
              error: ["50"]
              fatal: ["60"]
          - type: move
            id: message-json-autodetect-message
            if: "attributes[\"dog.log.rule\"] == \"json-autodetect\" and attributes[\"message\"] != nil"
            from: attributes["message"]
            to: body
          - type: move
            id: message-json-autodetect-msg
            if: "attributes[\"dog.log.rule\"] == \"json-autodetect\" and attributes[\"msg\"] != nil"
            from: attributes["msg"]
            to: body
      kubelet_stats:
        collection_interval: 15s
        auth_type: serviceAccount
        endpoint: "https://${env:K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        node: "${env:K8S_NODE_NAME}"
        k8s_api_config:
          auth_type: serviceAccount
        metric_groups: [node, pod, container, volume]
        metrics:
          k8s.pod.cpu_limit_utilization: {enabled: true}
          k8s.pod.memory_limit_utilization: {enabled: true}
          k8s.container.cpu_limit_utilization: {enabled: true}
          k8s.container.memory_limit_utilization: {enabled: true}
      host_metrics:
        collection_interval: 15s
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization: {enabled: true}
          memory:
            metrics:
              system.memory.utilization: {enabled: true}
          load: {}
          disk: {}
          filesystem:
            exclude_mount_points:
              mount_points: ["/dev/.*", "/proc/.*", "/sys/.*", "/run/.*", "/var/lib/docker/.*", "/var/lib/kubelet/.*", "/var/lib/rancher/.*", "/snap/.*", "/hostfs/dev/.*", "/hostfs/proc/.*", "/hostfs/sys/.*", "/hostfs/run/.*", "/hostfs/var/lib/kubelet/.*", "/hostfs/var/lib/rancher/.*", "/hostfs/var/lib/docker/.*"]
              match_type: regexp
            exclude_fs_types:
              fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, procfs, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tracefs, tmpfs]
              match_type: strict
          network: {}
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/self:
        config:
          scrape_configs:
            - job_name: otel-agent
              scrape_interval: 30s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      k8s_attributes:
        auth_type: serviceAccount
        wait_for_metadata: true
        wait_for_metadata_timeout: 30s
        watch_sync_period: 0s
        pod_delete_grace_period: 120s
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.job.name
            - k8s.cronjob.name
            - k8s.node.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
            - k8s.cluster.uid
          labels:
            - {tag_name: "app.kubernetes.io/name", key: "app.kubernetes.io/name", from: pod}
            - {tag_name: "app.kubernetes.io/component", key: "app.kubernetes.io/component", from: pod}
            - {tag_name: "app.kubernetes.io/instance", key: "app.kubernetes.io/instance", from: pod}
          otel_annotations: true
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
          - sources: [{from: resource_attribute, name: k8s.pod.ip}]
          - sources: [{from: resource_attribute, name: k8s.namespace.name}, {from: resource_attribute, name: k8s.pod.name}]
          - sources: [{from: connection}]
      resource_detection:
        detectors:
          - env
          - k8s_api
        override: false
        timeout: 5s
      resource:
        attributes:
          - {key: k8s.cluster.name, value: "my-cluster", action: upsert}

    exporters:
      otlp_grpc:
        endpoint: "dog-ai-observe-stack-otel-gateway.dog.svc:4317"
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 20000
          sizer: items
          block_on_overflow: true
          storage: file_storage
          batch:
            flush_timeout: 2s
            min_size: 1024
            max_size: 8192
            sizer: items
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol/file_storage
        create_directory: true
        compaction:
          on_start: true
          on_rebound: true
          directory: /var/lib/otelcol/file_storage/tmp

    service:
      extensions: [health_check, file_storage]
      telemetry:
        logs:
          level: info
          encoding: json
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      pipelines:
        logs:
          receivers: [file_log, otlp]
          processors: [memory_limiter, k8s_attributes, resource_detection, resource]
          exporters: [otlp_grpc]
        metrics:
          receivers: [kubelet_stats, host_metrics, otlp, prometheus/self]
          processors: [memory_limiter, k8s_attributes, resource_detection, resource]
          exporters: [otlp_grpc]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8s_attributes, resource_detection, resource]
          exporters: [otlp_grpc]
