apiVersion: apps/v1
kind: Deployment
metadata:
  name: dog-k8s-collector-cluster
  labels:
    app.kubernetes.io/name: dog-k8s-collector
    app.kubernetes.io/instance: dog-k8s-collector
    app.kubernetes.io/version: "0.160.0"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: cluster
  namespace: dog-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dog-k8s-collector-cluster
      app.kubernetes.io/instance: dog-k8s-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dog-k8s-collector-cluster
        app.kubernetes.io/instance: dog-k8s-collector
        app.kubernetes.io/component: cluster
      annotations: {}
    spec:
      serviceAccountName: dog-k8s-collector-cluster
      containers:
        - name: cluster
          image: "otel/opentelemetry-collector-k8s:0.160.0"
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: GOMEMLIMIT
              valueFrom: {resourceFieldRef: {resource: limits.memory}}
          ports:
            - {name: health-check, containerPort: 13133}
            - {name: metrics, containerPort: 8888}
          livenessProbe:
            httpGet: {path: /, port: health-check}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: health-check}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: file-storage, mountPath: /var/lib/otelcol}
      volumes:
        - name: config
          configMap:
            name: dog-k8s-collector-cluster-config
        - name: file-storage
          emptyDir: {}
