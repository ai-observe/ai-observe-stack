# Source: dog-k8s-collector/templates/configmap-cluster.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dog-k8s-collector-cluster-config
  labels:
    app.kubernetes.io/name: dog-k8s-collector
    app.kubernetes.io/instance: dog-k8s-collector
    app.kubernetes.io/version: "0.160.0"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/component: cluster
  namespace: dog-stack
data:
  config.yaml: |
    # OpenTelemetry cluster collector (Deployment) - generated by the dog-k8s-collector chart
    receivers:
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
        metrics:
          k8s.node.condition: {enabled: true}
          k8s.container.status.reason: {enabled: true}
          k8s.container.status.state: {enabled: true}
          k8s.pod.status_reason: {enabled: true}
        k8s_leader_elector: k8s_leader_elector
      k8s_objects:
        auth_type: serviceAccount
        objects:
          - name: events
            mode: watch
            group: events.k8s.io
            exclude_watch_type: [DELETED]
        storage: file_storage
        k8s_leader_elector: k8s_leader_elector
      prometheus/self:
        config:
          scrape_configs:
            - job_name: otel-cluster
              scrape_interval: 30s
              static_configs:
                - targets: ['localhost:8888']

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resource:
        attributes:
          - {key: k8s.cluster.name, value: "my-cluster", action: upsert}

    exporters:
      otlp_grpc:
        endpoint: "dog-ai-observe-stack-otel-gateway.dog.svc:4317"
        tls:
          insecure: true
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 10000
          sizer: items
          block_on_overflow: true
          storage: file_storage
          batch:
            flush_timeout: 5s
            min_size: 512
            max_size: 4096
            sizer: items
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol/file_storage
        create_directory: true
      k8s_leader_elector:
        auth_type: serviceAccount
        lease_name: dog-k8s-collector-cluster
        lease_namespace: dog-stack
        lease_duration: 15s
        renew_deadline: 10s
        retry_period: 2s

    service:
      extensions: [health_check, file_storage, k8s_leader_elector]
      telemetry:
        logs:
          level: info
          encoding: json
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: "0.0.0.0"
                    port: 8888
      pipelines:
        metrics:
          receivers: [k8s_cluster, prometheus/self]
          processors: [memory_limiter, resource]
          exporters: [otlp_grpc]
        logs:
          receivers: [k8s_objects]
          processors: [memory_limiter, resource]
          exporters: [otlp_grpc]
