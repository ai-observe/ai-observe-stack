{{/*
Cluster collector configuration (Deployment):
object metrics (k8s_cluster) and Kubernetes Events (k8s_objects). Exactly-once per cluster.
*/}}
{{- define "dogc.cluster.config" -}}
{{- $c := .Values.cluster -}}
{{- $p := .Values.presets -}}
{{- $m := $p.clusterMetrics -}}
{{- $endpoint := include "dogc.gateway.endpoint" . -}}
receivers:
  {{- if $m.enabled }}
  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: {{ $m.interval }}
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    allocatable_types_to_report: [cpu, memory, ephemeral-storage, pods]
    metrics:
      k8s.node.condition: {enabled: true}
      k8s.container.status.reason: {enabled: true}
      k8s.container.status.state: {enabled: true}
      k8s.pod.status_reason: {enabled: true}
    {{- if $c.leaderElection.enabled }}
    k8s_leader_elector: k8s_leader_elector
    {{- end }}
  {{- end }}
  {{- if $p.kubernetesEvents.enabled }}
  k8s_objects:
    auth_type: serviceAccount
    objects:
      - name: events
        mode: watch
        group: events.k8s.io
        exclude_watch_type: [DELETED]
    storage: file_storage
    {{- if $c.leaderElection.enabled }}
    k8s_leader_elector: k8s_leader_elector
    {{- end }}
  {{- end }}
  {{- if $p.selfMonitoring.enabled }}
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-cluster
          scrape_interval: 30s
          static_configs:
            - targets: ['localhost:8888']
  {{- end }}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resource:
    attributes:
      - {key: k8s.cluster.name, value: {{ include "dogc.clusterName" . | quote }}, action: upsert}

exporters:
  otlp_grpc:
    endpoint: {{ $endpoint | quote }}
    {{- with .Values.gateway.balancerName }}
    balancer_name: {{ . }}
    {{- end }}
    tls:
      insecure: {{ .Values.gateway.tls.insecure }}
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 10000
      sizer: items
      block_on_overflow: true
      storage: file_storage
      batch:
        flush_timeout: 5s
        min_size: 512
        max_size: 4096
        sizer: items
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: true
  {{- if $c.leaderElection.enabled }}
  k8s_leader_elector:
    auth_type: serviceAccount
    lease_name: {{ include "dogc.cluster.fullname" . }}
    lease_namespace: {{ .Release.Namespace }}
    lease_duration: 15s
    renew_deadline: 10s
    retry_period: 2s
  {{- end }}

service:
  extensions: [health_check, file_storage{{ if $c.leaderElection.enabled }}, k8s_leader_elector{{ end }}]
  telemetry:
    logs:
      level: {{ $c.logging.level }}
      encoding: json
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    {{- if or $m.enabled $p.selfMonitoring.enabled }}
    metrics:
      receivers: [{{ if $m.enabled }}k8s_cluster{{ end }}{{ if and $m.enabled $p.selfMonitoring.enabled }}, {{ end }}{{ if $p.selfMonitoring.enabled }}prometheus/self{{ end }}]
      processors: [memory_limiter, resource]
      exporters: [otlp_grpc]
    {{- end }}
    {{- if $p.kubernetesEvents.enabled }}
    logs:
      receivers: [k8s_objects]
      processors: [memory_limiter, resource]
      exporters: [otlp_grpc]
    {{- end }}
{{- end }}

{{- if include "dogc.cluster.enabled" . | eq "true" }}
{{- $raw := include "dogc.cluster.config" . }}
{{- $cfg := $raw | fromYaml }}
{{- if hasKey $cfg "Error" }}{{ fail (printf "cluster config template did not render valid YAML: %s" (get $cfg "Error")) }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dogc.cluster.fullname" . }}-config
  labels:
    {{- include "dogc.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster
data:
  config.yaml: |
    # OpenTelemetry cluster collector (Deployment) - generated by the dog-k8s-collector chart
    {{- if .Values.cluster.extraConfig }}
    {{- mergeOverwrite $cfg .Values.cluster.extraConfig | toYaml | nindent 4 }}
    {{- else }}
    {{- $raw | nindent 4 }}
    {{- end }}
{{- end }}
