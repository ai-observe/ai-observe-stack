apiVersion: v2
name: ai-observe-stack
description: AIObserve Stack (DOG Stack) - an observability backend with Apache Doris as storage for logs, metrics and traces, an OpenTelemetry gateway and Grafana. Collect Kubernetes clusters with the dog-k8s-collector chart.
type: application
version: 0.2.0
# appVersion tracks the OpenTelemetry Collector shipped by the chart
appVersion: "0.160.0"

keywords:
  - observability
  - ai-observe-stack
  - doris
  - grafana
  - opentelemetry
  - doris-app
  - traces
  - metrics
  - logs

home: https://github.com/ai-observe/ai-observe-stack.git
icon: https://charts.velodb.io/images/doris.jpg

maintainers:
  - name: bingquanzhao
    email: bingquan_zhao@icloud.com
dependencies:
  # Doris Operator - only when using internal Doris
  # Provides CRDs for DorisCluster management
  - name: doris-operator
    version: "1.6.1"
    repository: https://charts.selectdb.com
    condition: doris.internal.operator.enabled
    alias: dorisOperator

# Note: OpenTelemetry Collector and Grafana are deployed via custom templates
# in this chart for better control over configuration. The official subcharts
# can be enabled if preferred by modifying this file.
