{{/*
Gateway StatefulSet + Services. Values live under `gateway`.
*/}}
{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiobs.gateway.fullname" . }}-headless
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - {name: otlp-grpc, port: {{ $g.ports.otlpGrpc }}, targetPort: {{ $g.ports.otlpGrpc }}, protocol: TCP}
    - {name: otlp-http, port: {{ $g.ports.otlpHttp }}, targetPort: {{ $g.ports.otlpHttp }}, protocol: TCP}
    - {name: metrics, port: {{ $g.ports.metrics }}, targetPort: {{ $g.ports.metrics }}, protocol: TCP}
    - {name: health-check, port: {{ $g.ports.healthCheck }}, targetPort: {{ $g.ports.healthCheck }}, protocol: TCP}
  selector:
    app.kubernetes.io/name: {{ include "aiobs.name" . }}-otel-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
# OTLP entry point for agents, the cluster collector and SDKs
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiobs.gateway.fullname" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
  {{- with $g.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $g.service.type | default "ClusterIP" }}
  ports:
    - {name: otlp-grpc, port: {{ $g.ports.otlpGrpc }}, targetPort: {{ $g.ports.otlpGrpc }}, protocol: TCP}
    - {name: otlp-http, port: {{ $g.ports.otlpHttp }}, targetPort: {{ $g.ports.otlpHttp }}, protocol: TCP}
    - {name: metrics, port: {{ $g.ports.metrics }}, targetPort: {{ $g.ports.metrics }}, protocol: TCP}
    - {name: health-check, port: {{ $g.ports.healthCheck }}, targetPort: {{ $g.ports.healthCheck }}, protocol: TCP}
  selector:
    app.kubernetes.io/name: {{ include "aiobs.name" . }}-otel-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aiobs.gateway.fullname" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  serviceName: {{ include "aiobs.gateway.fullname" . }}-headless
  replicas: {{ $g.replicas }}
  podManagementPolicy: {{ $g.podManagementPolicy | default "Parallel" }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiobs.name" . }}-otel-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aiobs.name" . }}-otel-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: otel-gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-otel-gateway.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if eq .Values.doris.mode "internal" }}
      initContainers:
        - name: wait-for-doris
          image: {{ .Values.global.helperImages.busybox | quote }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "aiobs.doris.clusterName" . }}-fe-service 9030; do echo "waiting for Doris FE 9030"; sleep 5; done
              until nc -z {{ include "aiobs.doris.clusterName" . }}-fe-service 8030; do echo "waiting for Doris FE 8030"; sleep 5; done
      {{- end }}
      containers:
        - name: otel-gateway
          image: "{{ $g.image.repository }}:{{ $g.image.tag }}"
          imagePullPolicy: {{ $g.image.pullPolicy }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - {name: otlp-grpc, containerPort: {{ $g.ports.otlpGrpc }}}
            - {name: otlp-http, containerPort: {{ $g.ports.otlpHttp }}}
            - {name: metrics, containerPort: {{ $g.ports.metrics }}}
            - {name: health-check, containerPort: {{ $g.ports.healthCheck }}}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: DORIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiobs.doris.secretName" . }}
                  key: {{ include "aiobs.doris.secretUserKey" . }}
            - name: DORIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiobs.doris.secretName" . }}
                  key: {{ include "aiobs.doris.secretPasswordKey" . }}
            - name: GOMEMLIMIT
              valueFrom: {resourceFieldRef: {resource: limits.memory}}
          livenessProbe:
            httpGet: {path: /, port: health-check}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /, port: health-check}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            {{- if $g.persistence.enabled }}
            - {name: data, mountPath: {{ $g.persistence.path }}}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aiobs.gateway.fullname" . }}-config
  {{- if $g.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        # immutable field: stable labels only (never helm.sh/chart or app version)
        labels:
          {{- include "aiobs.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: otel-gateway
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $g.persistence.storageClass }}
        storageClassName: {{ $g.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $g.persistence.size }}
  {{- end }}
{{- end }}
