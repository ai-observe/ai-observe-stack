{{/*
Grafana provisioning: Doris datasource (credentials from the Doris Secret via env vars),
dashboard providers, doris-app plugin.
*/}}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiobs.grafana.fullname" . }}-datasources
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Doris
        type: mysql
        uid: doris
        url: {{ include "aiobs.doris.mysqlEndpoint" . }}
        user: $DORIS_USERNAME
        database: {{ include "aiobs.doris.database" . }}
        isDefault: true
        jsonData:
          maxOpenConns: 10
          maxIdleConns: 10
          connMaxLifetime: 14400
          tlsSkipVerify: true
        secureJsonData:
          password: $DORIS_PASSWORD
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiobs.grafana.fullname" . }}-dashboard-providers
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'AIObserve Stack Dashboards'
        orgId: 1
        folder: 'AIObserve Stack'
        folderUid: aiobs-observability
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/aiobs
      - name: 'AIObserve Stack Kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        folderUid: aiobs-kubernetes
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/extra
{{- if .Values.dorisPlugin.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiobs.grafana.fullname" . }}-plugins
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  plugins.yaml: |
    apiVersion: 1
    apps:
      - type: {{ .Values.dorisPlugin.pluginId | quote }}
        org_id: 1
        disabled: false
{{- end }}
{{- end }}
