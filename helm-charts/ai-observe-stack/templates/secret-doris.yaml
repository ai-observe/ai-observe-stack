{{/*
Doris credentials. Always delivered to the gateway and Grafana through a Secret:
either the user's existingSecret (external mode) or this one, built from values.
*/}}
{{- include "aiobs.validate" . -}}
{{- if not (and (eq .Values.doris.mode "external") .Values.doris.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiobs.doris.secretName" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: doris
type: Opaque
stringData:
  username: {{ include "aiobs.doris.user" . | quote }}
  password: {{ include "aiobs.doris.password" . | quote }}
{{- end }}
