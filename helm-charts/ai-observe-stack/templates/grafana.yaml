{{/*
Grafana Deployment, Service and optional PVC.
*/}}
{{- if .Values.grafana.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiobs.grafana.fullname" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiobs.name" . }}-grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aiobs.name" . }}-grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/datasources: {{ include (print $.Template.BasePath "/configmap-grafana.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 472
        runAsUser: 472
        runAsGroup: 472
      initContainers:
        - name: init-chown-data
          image: {{ .Values.global.helperImages.busybox | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/grafana/plugins /var/lib/grafana/dashboards/aiobs
              chown -R 472:472 /var/lib/grafana
              chmod -R 755 /var/lib/grafana
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
        {{- if .Values.dorisPlugin.enabled }}
        - name: copy-assets
          image: {{ .Values.dorisPlugin.image.repository }}:{{ .Values.dorisPlugin.image.tag }}
          imagePullPolicy: {{ .Values.dorisPlugin.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - |
              cp -r /assets/plugins/* /var/lib/grafana/plugins/
              cp -r /assets/dashboards/* /var/lib/grafana/dashboards/aiobs/
              chown -R 472:472 /var/lib/grafana/plugins /var/lib/grafana/dashboards
              chmod -R 755 /var/lib/grafana/plugins /var/lib/grafana/dashboards
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
        {{- end }}
        {{- if eq .Values.doris.mode "internal" }}
        - name: wait-for-doris
          image: {{ .Values.global.helperImages.busybox | quote }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "aiobs.doris.clusterName" . }}-fe-service 9030; do echo "waiting for Doris FE"; sleep 5; done
        {{- end }}
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000, protocol: TCP}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiobs.grafana.secretName" . }}
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiobs.grafana.secretName" . }}
                  key: admin-password
            {{- with .Values.grafana.plugins }}
            - name: GF_INSTALL_PLUGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: GF_LOG_LEVEL
              value: "info"
            - name: GF_PATHS_DATA
              value: /var/lib/grafana
            - name: GF_PATHS_PLUGINS
              value: /var/lib/grafana/plugins
            {{- if .Values.dorisPlugin.enabled }}
            - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
              value: {{ .Values.dorisPlugin.pluginId | quote }}
            {{- end }}
            # Doris credentials for the provisioned datasource ($DORIS_* expanded by Grafana)
            - name: DORIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiobs.doris.secretName" . }}
                  key: {{ include "aiobs.doris.secretUserKey" . }}
            - name: DORIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiobs.doris.secretName" . }}
                  key: {{ include "aiobs.doris.secretPasswordKey" . }}
            {{- range $key, $value := .Values.grafana.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            {{- if .Files.Glob "files/dashboards/*.json" }}
            - {name: extra-dashboards, mountPath: /var/lib/grafana/dashboards/extra, readOnly: true}
            {{- end }}
            {{- if .Values.dorisPlugin.enabled }}
            - {name: plugins, mountPath: /etc/grafana/provisioning/plugins, readOnly: true}
            {{- end }}
      volumes:
        - name: storage
          {{- if .Values.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aiobs.grafana.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: datasources
          configMap:
            name: {{ include "aiobs.grafana.fullname" . }}-datasources
        - name: dashboard-providers
          configMap:
            name: {{ include "aiobs.grafana.fullname" . }}-dashboard-providers
        {{- if .Files.Glob "files/dashboards/*.json" }}
        - name: extra-dashboards
          configMap:
            name: {{ include "aiobs.grafana.fullname" . }}-extra-dashboards
        {{- end }}
        {{- if .Values.dorisPlugin.enabled }}
        - name: plugins
          configMap:
            name: {{ include "aiobs.grafana.fullname" . }}-plugins
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiobs.grafana.fullname" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - {name: http, port: {{ .Values.grafana.service.port }}, targetPort: http, protocol: TCP}
  selector:
    app.kubernetes.io/name: {{ include "aiobs.name" . }}-grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- if .Values.grafana.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aiobs.grafana.fullname" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.grafana.persistence.storageClassName }}
  storageClassName: {{ .Values.grafana.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
{{- end }}
{{- end }}
