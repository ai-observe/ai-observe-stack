{{/*
Grafana admin credentials, delivered through a Secret (or grafana.existingSecret with keys
admin-user / admin-password).
*/}}
{{- if and .Values.grafana.enabled (not .Values.grafana.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiobs.grafana.secretName" . }}
  labels:
    {{- include "aiobs.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
{{- end }}
